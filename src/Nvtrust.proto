syntax = "proto3";

message NvtrustGPUInfo {
  string model = 1;
  string driverVersion = 2;
  string vbios = 3;
  bool dbgStat = 4;
}

message NvtrustGPUList {
  repeated NvtrustGPUInfo gpus = 1;
}

enum NvidiaGpuInterconnectStatus {
  // Multiple GPUs are present, but NVML observed no peer interconnect.
  // This is metadata and is not verified by NVIDIA attestation.
  NVIDIA_GPU_INTERCONNECT_DISCONNECTED = 0;

  // NVML observed a direct peer path, but its safety is not established by
  // NVIDIA attestation. This includes PCIe or unknown paths and NVLink that
  // requires switch attestation when no validated switch token is available.
  // Release/trusted policy must reject this state; test policy may allow it.
  NVIDIA_GPU_INTERCONNECT_DIRECT_UNVERIFIED = 1;

  // NVLink was observed, but separate switch attestation is not applicable
  // for the validated GPU architecture, for example Blackwell.
  NVIDIA_GPU_INTERCONNECT_NVLINK_SWITCH_ATTESTATION_NOT_APPLICABLE = 2;

  // NVLink was observed and the accompanying LS10 switch token was
  // successfully validated.
  NVIDIA_GPU_INTERCONNECT_NVLINK_SWITCH_ATTESTATION_VERIFIED = 3;
}

// Information extracted from a successfully validated NVIDIA switch token.
message NvidiaSwitchInfo {
  string model = 1;
  string biosVersion = 2;
  bool secureBoot = 3;
  bool debugEnabled = 4;
}

message NvidiaGpuInterconnectInfo {
  NvidiaGpuInterconnectStatus status = 1;
  repeated NvidiaSwitchInfo switches = 2;
}
