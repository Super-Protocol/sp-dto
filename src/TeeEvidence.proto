syntax = "proto3";

import "AmdSevSnp.proto";
import "IntelTDX.proto";

enum TeeEvidenceType {
  TEE_EVIDENCE_TYPE_UNSPECIFIED = 0;
  TEE_EVIDENCE_TYPE_AMD_SEV_SNP_QEMU = 1;
  TEE_EVIDENCE_TYPE_INTEL_TDX_QEMU = 2;
  TEE_EVIDENCE_TYPE_INTEL_TDX_GCP = 3;
}

message TeeEvidence {
  oneof evidence {
    AmdSevSnpQemuEvidence amdSevSnpQemu = 1;
    IntelTDXQemuEvidence intelTdxQemu = 2;
    IntelTDXGCPEvidence intelTdxGcp = 3;
  }
}
