syntax = "proto3";

enum SevSNPCertType {
  ARK = 0;
  ASK = 1;
  VCEK = 2;
  VLEK = 3;
}

enum SevSnpCertificateFormat {
  PEM = 0;
  DER = 1;
}

message SnpCert {
  SevSNPCertType type = 1;
  bytes cert = 2;
  SevSnpCertificateFormat format = 3;
}

message SNPReport {
  bytes rawReport = 1;
  uint32 cpuSig = 2;
  uint32 cores = 3;
  bytes cmdLineHash = 4;
  string build = 5;
}

message AmdSevSnpQemuEvidence {
  SNPReport snpReport = 1;
  repeated SnpCert certs = 2;
}

message AmdSevSnpAzureEvidence {
  // Raw HCL report read from vTPM NV index 0x01400001:
  // "HCLA" header + SEV-SNP attestation report + runtime data JSON (HCLAkPub, vm-configuration, user-data).
  // user-data holds the caller's userData (key or its hash), zero-padded to 64 bytes.
  bytes hclReport = 1;
  // VCEK, ASK and ARK for the SEV-SNP report embedded in hclReport.
  repeated SnpCert certs = 2;
  // TPMS_ATTEST from TPM2_Quote signed by the vTPM AK (0x81000003) over SHA-256 PCR 4 and 9;
  // qualifyingData = SHA-256(userData padded to 64 bytes).
  bytes tpmAttest = 3;
  // TPMT_SIGNATURE of tpmAttest (RSASSA, SHA-256).
  bytes tpmSignature = 4;
  // TCG2 crypto-agile event log: Spec ID header followed by PCR4 and PCR9 events only.
  // PCR values are recomputed by replaying it and checked against pcrDigest in tpmAttest.
  bytes eventLog = 5;
  // DER certificates: AK certificate (vTPM NV 0x01C101D0) first, then intermediates fetched via AIA.
  // The Microsoft root is pinned by the verifier and not included.
  repeated bytes akCertChain = 6;
}
